[project]
name = "meeting-playbook-backend"
version = "0.0.1"
description = "Backend service for meeting-playbook — audio capture, ASR, LLM, persistence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.51.0",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=1.75.0",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    "numpy>=2.4.4",
    "qwen-asr>=0.0.6",
    "opencc-python-reimplemented>=0.1.7",
    "pyannote-audio>=4.0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "httpx-ws>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
